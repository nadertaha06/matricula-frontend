server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    proxy_set_header X-Service-Token "";
    proxy_set_header Host $http_host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    location = /health { default_type text/plain; return 200 'ok'; }
    location /api/disciplinas/ {
        set $backend matricula-disciplinas:8001;
        rewrite ^/api/disciplinas/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }
    location /api/solicitacoes/ {
        set $backend matricula-solicitacoes:8002;
        rewrite ^/api/solicitacoes/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }
    location /api/processamento/ {
        set $backend matricula-processamento:8003;
        rewrite ^/api/processamento/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }
    location /api/ { return 404; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
