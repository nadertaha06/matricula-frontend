name: Frontend CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_AUTH0_DOMAIN: dev-ye1ln8pnfhd2hxus.us.auth0.com
          VITE_AUTH0_CLIENT_ID: 6JJxQTtn3Z4svk1JNuGLfa0bSGl9cja8
          VITE_AUTH0_AUDIENCE: https://matricula-api
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
